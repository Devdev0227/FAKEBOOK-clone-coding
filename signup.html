<!DOCTYPE html>
<html lang="ko" class="auth-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKEBOOK 회원가입</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <header class="auth-brand-row">
            <a href="index.html" class="auth-brand-link">
                <img src="img/FakebookLogo2.png" alt="Fakebook 로고">
                <span>FAKEBOOK</span>
            </a>
        </header>

        <main class="auth-main">
            <section class="auth-card signup-card">
                <div class="auth-card-title">
                    <h1>새 계정 만들기</h1>
                    <p>FAKEBOOK에서 새로운 사람들과 만나보세요.</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-row two-col">
                        <div class="field-group">
                            <label for="signupName">이름</label>
                            <input type="text" id="signupName" placeholder="이름" required>
                        </div>
                        <div class="field-group">
                            <label for="signupPhone">전화번호</label>
                            <input type="tel" id="signupPhone" placeholder="전화번호" required>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="signupId">아이디</label>
                        <input type="text" id="signupId" placeholder="로그인에 사용할 아이디" required>
                    </div>

                    <div class="field-group">
                        <label for="signupPassword">비밀번호</label>
                        <input type="password" id="signupPassword" placeholder="비밀번호" required>
                    </div>

                    <div class="field-group">
                        <label for="signupPasswordConfirm">비밀번호 확인</label>
                        <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 다시 입력" required>
                    </div>

                    <p class="auth-note">※ 이 프로젝트는 학습용으로 브라우저의 localStorage에 회원정보를 저장합니다.</p>

                    <button type="submit" class="auth-primary-button">가입하기</button>
                </form>

                <a class="auth-text-link" href="index.html">이미 계정이 있으신가요? 로그인</a>
            </section>
        </main>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
