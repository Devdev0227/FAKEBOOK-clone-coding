<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakebook</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body>
    <div class="page">

        <nav class="navbar">
            <div class="brand">
                <img src="./img/FakebookLogo2.png" alt="">
                <h2>FAKEBOOK</h2>
            </div>

            <main class="content">

            <section class="left">
            </section>

            <aside class="right">
            </aside>

        </main>

        </nav>

        <div class="textcontainer">

            <h1 class="text0">취향 저격</h1>
            <h1 class="text1">다양한 콘텐츠를</h1>
            <h1 class="text2">만나는 곳</h1>

        </div>

        <div class="logincontainer">

            <form action="/login" method="POST">

                <h3>FAKEBOOK에 로그인</h3>

                    <p class="idinput">
                        <label for="name"></label>
                        <input type="text" name="name" id="name" required placeholder="아이디">
                    </p>

                    <p class="pwinput">
                        <label for="password"></label>
                        <input type="password" name="password" id="password" required placeholder="비밀번호">
                    </p>

                <button type="submit" class="loginbutton1">로그인</button>
                <button type="button" class="loginbutton2">비밀번호를 잊으셨나요?</button> <!--<a> 변경-->
                <button type="button" class="loginbutton3">새 계정 만들기</button>

            </form>

        </div>
        
        <div class="icon">
            <img class="Betaicon" src="./img/Beta icon.png" alt="">
        </div>

        <div class="icon">
            <img class="mainimage" src="./img/mainimage.png" alt="">
        </div>

    </div>

</body>
</html>
