<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKEBOOK 로그인</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body class="login-page">
    <header class="login-header">
        <a class="brand" href="index.html"><img src="img/FakebookLogo2.png" alt=""><span>FAKEBOOK</span></a>
        <img class="beta-badge" src="img/Beta icon.png" alt="Beta">
    </header>
    <main class="login-layout">
        <section class="login-intro" aria-labelledby="introTitle">
            <h1 id="introTitle"><span>취향 저격</span><br>다양한 콘텐츠를<br>만나는 곳</h1>
            <img class="login-illustration" src="img/mainimage.png" alt="Fakebook 메인 이미지">
        </section>
        <section class="login-card" aria-labelledby="loginTitle">
            <form id="loginForm" action="#" method="POST">
                <h2 id="loginTitle">FAKEBOOK에 로그인</h2>
                <div class="field-group">
                    <label for="name">아이디</label>
                    <input type="text" name="name" id="name" required placeholder="아이디" autocomplete="username">
                </div>
                <div class="field-group">
                    <label for="password">비밀번호</label>
                    <input type="password" name="password" id="password" required placeholder="비밀번호" autocomplete="current-password">
                </div>
                <button type="submit" class="auth-primary-button">로그인</button>
                <button type="button" class="login-find-button" id="findPasswordButton">비밀번호를 잊으셨나요?</button>
                <div class="login-divider"></div>
                <button type="button" class="login-signup-button" id="signupButton">새 계정 만들기</button>
            </form>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
