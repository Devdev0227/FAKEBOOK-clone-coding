<!DOCTYPE html>
<html lang="ko" class="auth-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKEBOOK 비밀번호 재설정</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <header class="auth-brand-row">
            <a href="index.html" class="auth-brand-link">
                <img src="img/Beta icon.png" alt="Beta 로고">
                <span>FAKEBOOK</span>
            </a>
        </header>

        <main class="auth-main">
            <section class="auth-card small-card">
                <div class="auth-card-title">
                    <h1>새 비밀번호 설정</h1>
                    <p>새 비밀번호를 입력한 뒤 로그인 화면으로 이동합니다.</p>
                </div>

                <form id="resetPasswordForm" class="auth-form">
                    <div class="field-group">
                        <label for="newPassword">새 비밀번호</label>
                        <input type="password" id="newPassword" placeholder="새 비밀번호" required>
                    </div>

                    <div class="field-group">
                        <label for="newPasswordConfirm">새 비밀번호 확인</label>
                        <input type="password" id="newPasswordConfirm" placeholder="새 비밀번호 다시 입력" required>
                    </div>

                    <button type="submit" class="auth-primary-button">비밀번호 변경</button>
                </form>

                <p class="auth-error" id="resetPasswordMessage" aria-live="polite"></p>
            </section>
        </main>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
