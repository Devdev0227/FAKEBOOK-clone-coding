<!DOCTYPE html>
<html lang="ko" class="auth-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKEBOOK 비밀번호 찾기</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <header class="auth-brand-row">
            <a href="index.html" class="auth-brand-link">
                <img src="img/Beta icon.png" alt="Beta 로고">
                <span>FAKEBOOK</span>
            </a>
        </header>

        <main class="auth-main">
            <section class="auth-card small-card">
                <div class="auth-card-title">
                    <h1>비밀번호 찾기</h1>
                    <p>가입할 때 입력한 이름과 전화번호를 확인합니다.</p>
                </div>

                <form id="findPasswordForm" class="auth-form">
                    <div class="field-group">
                        <label for="findName">이름</label>
                        <input type="text" id="findName" placeholder="이름" required>
                    </div>

                    <div class="field-group">
                        <label for="findPhone">전화번호</label>
                        <input type="tel" id="findPhone" placeholder="전화번호" required>
                    </div>

                    <button type="submit" class="auth-primary-button">계정 확인</button>
                </form>

                <p class="auth-error" id="findPasswordMessage" aria-live="polite"></p>
                <a class="auth-text-link" href="index.html">로그인 화면으로 돌아가기</a>
            </section>
        </main>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
