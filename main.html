<!DOCTYPE html>
<html lang="ko" class="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKEBOOK 메인</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body class="app-page">
    <header class="app-navbar">
        <a class="app-brand" href="main.html">
            <img src="img/FakebookLogo2.png" alt="Fakebook 로고">
            <span>FAKEBOOK</span>
        </a>
        <button type="button" class="app-logout" id="logoutButton">로그아웃</button>
    </header>

    <main class="app-layout">
        <aside class="app-sidebar">
            <div class="app-profile-card">
                <img src="img/FakebookLogo2.png" alt="프로필 기본 이미지">
                <strong id="welcomeName">사용자</strong>
                <span>FAKEBOOK에 오신 것을 환영합니다.</span>
            </div>
            <nav class="app-menu">
                <a href="#home" id="homeLink" aria-current="page">홈</a>
                <a href="#">친구</a>
                <a href="#saved" id="savedLink">저장됨</a>
            </nav>
        </aside>

        <section class="app-feed">
            <div class="feed-composer">
                <h2>무슨 생각을 하고 있나요?</h2>
                <textarea id="postText" placeholder="오늘의 이야기를 작성해보세요."></textarea>
                <div class="attachment-picker">
                    <input class="attachment-input" type="file" id="postMedia" aria-label="사진·동영상 첨부" aria-describedby="attachmentHint" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/ogg" multiple>
                    <label class="attachment-button" for="postMedia">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg>
                        <span>사진·동영상</span>
                    </label>
                </div>
                <p class="attachment-hint" id="attachmentHint">최대 4개 · 파일당 20MB까지 첨부할 수 있어요.</p>
                <div id="mediaPreview" class="media-grid"></div>
                <p id="feedMessage" role="status" aria-live="polite"></p>
                <button type="button" id="postButton" class="auth-primary-button">게시하기</button>
            </div>

            <h2 id="feedTitle">홈</h2>
            <div id="localPosts"></div>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/feed.js"></script>
</body>
</html>
