<!DOCTYPE html>
<html lang="ko" class="auth-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKEBOOK 아이디 찾기</title>
    <link rel="stylesheet" href="css/fakebook.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <header class="auth-brand-row">
            <a href="index.html" class="auth-brand-link">
                <img src="img/Beta icon.png" alt="Beta 로고">
                <span>FAKEBOOK</span>
            </a>
        </header>

        <main class="auth-main">
            <section class="auth-card small-card">
                <div class="auth-card-title">
                    <h1>아이디 찾기</h1>
                    <p>회원가입할 때 입력한 이름과 전화번호로 아이디를 찾습니다.<br>전화번호는 - 없이 숫자만 입력하세요.</p>
                </div>

                <form id="findIdForm" class="auth-form">
                    <div class="field-group">
                        <label for="findIdName">이름</label>
                        <input type="text" id="findIdName" placeholder="이름" required>
                    </div>

                    <div class="field-group">
                        <label for="findIdPhone">전화번호</label>
                        <input type="tel" id="findIdPhone" placeholder="전화번호 (숫자만)" inputmode="numeric" pattern="[0-9]{10,11}" minlength="10" maxlength="11" required>
                    </div>

                    <button type="submit" class="auth-primary-button">아이디 찾기</button>
                </form>

                <p class="auth-error" id="findIdMessage" role="status" aria-live="polite"></p>
                <section class="auth-recovery-result" id="findIdResult" aria-labelledby="foundIdTitle" hidden>
                    <p id="foundIdTitle">가입한 아이디</p>
                    <strong id="foundId"></strong>
                </section>
                <a class="auth-text-link" href="index.html">로그인 화면으로 돌아가기</a>
                <a class="auth-text-link" href="find-password.html">비밀번호도 잊으셨나요?</a>
            </section>
        </main>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
